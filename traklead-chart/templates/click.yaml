apiVersion: apps/v1
kind: Deployment
metadata:
  name: traklead-click
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traklead.commonLabels" (dict "Release" .Release "component" "click") | nindent 4 }}
spec:
  replicas: {{ .Values.click.replicas }}
  selector:
    matchLabels:
      {{- include "traklead.selectorLabels" (dict "Release" .Release "component" "click") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traklead.commonLabels" (dict "Release" .Release "component" "click") | nindent 8 }}
    spec:
      initContainers:
        - name: wait-for-postgres
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z traklead-postgres 5432; do
                echo "waiting for postgres..."; sleep 3;
              done
        - name: wait-for-server
          image: busybox:1.36
          command:
            - sh
            - -c
            - |
              until nc -z traklead-server {{ .Values.server.port }}; do
                echo "waiting for traklead-server..."; sleep 3;
              done
              sleep 10
      containers:
        - name: traklead-click
          image: "{{ .Values.click.image.repository }}:{{ .Values.click.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: {{ .Values.click.port }}
          env:
            - name: SPRING_DATASOURCE_URL
              value: "jdbc:postgresql://traklead-postgres:5432/{{ .Values.postgresql.database }}?rewriteBatchedStatements=true"
            - name: SPRING_DATASOURCE_USERNAME
              valueFrom:
                secretKeyRef:
                  name: traklead-postgres-secret
                  key: POSTGRES_USER
            - name: SPRING_DATASOURCE_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: traklead-postgres-secret
                  key: POSTGRES_PASSWORD
            - name: TRAKLEAD_CACHE_TYPE
              value: "redis"
            - name: TRAKLEAD_REDIS_HOST
              value: "traklead-redis"
            - name: TRAKLEAD_REDIS_PORT
              value: "6379"
            - name: TRAKLEAD_REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: traklead-redis-secret
                  key: REDIS_PASSWORD
            - name: TRAKLEAD_REDIS_SSL_ENABLED
              value: "false"
            - name: TRAKLEAD_MESSAGING_TYPE
              value: "kafka"
            - name: SPRING_KAFKA_BOOTSTRAP_SERVERS
              value: "traklead-kafka:9092"
            - name: TRAKLEAD_GEOIP_DB_PATH
              value: "/opt/traklead-click/GeoLite2-Country.mmdb"
            - name: TRAKLEAD_TENANT_NAME
              value: {{ .Values.click.env.tenantName | quote }}
          readinessProbe:
            tcpSocket:
              port: {{ .Values.click.port }}
            initialDelaySeconds: 45
            periodSeconds: 10
            failureThreshold: 10
          livenessProbe:
            tcpSocket:
              port: {{ .Values.click.port }}
            initialDelaySeconds: 120
            periodSeconds: 20
            failureThreshold: 6
          resources:
            {{- toYaml .Values.click.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: traklead-click
  namespace: {{ .Values.namespace }}
spec:
  selector:
    {{- include "traklead.selectorLabels" (dict "Release" .Release "component" "click") | nindent 4 }}
  ports:
    - port: {{ .Values.click.port }}
      targetPort: {{ .Values.click.port }}
  type: ClusterIP
