apiVersion: v1
kind: ConfigMap
metadata:
  name: traklead-kafka-config
  namespace: {{ .Values.namespace }}
data:
  server.properties: |
    process.roles=broker,controller
    node.id=1
    controller.quorum.voters=1@localhost:9093
    listeners=PLAINTEXT://:9092,CONTROLLER://:9093
    advertised.listeners=PLAINTEXT://traklead-kafka.{{ .Values.namespace }}.svc.cluster.local:9092
    controller.listener.names=CONTROLLER
    listener.security.protocol.map=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
    inter.broker.listener.name=PLAINTEXT
    log.dirs=/var/lib/kafka/data
    num.partitions=3
    offsets.topic.replication.factor=1
    transaction.state.log.replication.factor=1
    transaction.state.log.min.isr=1
    group.initial.rebalance.delay.ms=0
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traklead-kafka-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.kafka.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.kafka.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traklead-kafka
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traklead.commonLabels" (dict "Release" .Release "component" "kafka") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "traklead.selectorLabels" (dict "Release" .Release "component" "kafka") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traklead.commonLabels" (dict "Release" .Release "component" "kafka") | nindent 8 }}
    spec:
      containers:
        - name: kafka
          image: "{{ .Values.kafka.image.repository }}:{{ .Values.kafka.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: ["sh", "-c"]
          args:
            - |
              set -e
              CLUSTER_ID=$(/opt/kafka/bin/kafka-storage.sh random-uuid)
              /opt/kafka/bin/kafka-storage.sh format --ignore-formatted -t "$CLUSTER_ID" -c /etc/kafka/server.properties
              exec /opt/kafka/bin/kafka-server-start.sh /etc/kafka/server.properties
          ports:
            - containerPort: 9092
            - containerPort: 9093
          volumeMounts:
            - name: config
              mountPath: /etc/kafka/server.properties
              subPath: server.properties
            - name: data
              mountPath: /var/lib/kafka/data
          readinessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 15
            periodSeconds: 10
          livenessProbe:
            tcpSocket:
              port: 9092
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            {{- toYaml .Values.kafka.resources | nindent 12 }}
      volumes:
        - name: config
          configMap:
            name: traklead-kafka-config
        - name: data
          persistentVolumeClaim:
            claimName: traklead-kafka-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: traklead-kafka
  namespace: {{ .Values.namespace }}
spec:
  selector:
    {{- include "traklead.selectorLabels" (dict "Release" .Release "component" "kafka") | nindent 4 }}
  ports:
    - name: broker
      port: 9092
      targetPort: 9092
    - name: controller
      port: 9093
      targetPort: 9093
