apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: traklead-postgres-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ .Values.postgresql.storageClassName }}
  resources:
    requests:
      storage: {{ .Values.postgresql.storage }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: traklead-postgres
  namespace: {{ .Values.namespace }}
  labels:
    {{- include "traklead.commonLabels" (dict "Release" .Release "component" "postgres") | nindent 4 }}
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      {{- include "traklead.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "traklead.commonLabels" (dict "Release" .Release "component" "postgres") | nindent 8 }}
    spec:
      containers:
        - name: postgres
          image: "{{ .Values.postgresql.image.repository }}:{{ .Values.postgresql.image.tag }}"
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          ports:
            - containerPort: 5432
          envFrom:
            - secretRef:
                name: traklead-postgres-secret
          env:
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgresql.username }}", "-d", "{{ .Values.postgresql.database }}"]
            initialDelaySeconds: 5
            periodSeconds: 5
          livenessProbe:
            exec:
              command: ["pg_isready", "-U", "{{ .Values.postgresql.username }}", "-d", "{{ .Values.postgresql.database }}"]
            initialDelaySeconds: 15
            periodSeconds: 15
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: traklead-postgres-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: traklead-postgres
  namespace: {{ .Values.namespace }}
spec:
  selector:
    {{- include "traklead.selectorLabels" (dict "Release" .Release "component" "postgres") | nindent 4 }}
  ports:
    - port: 5432
      targetPort: 5432
